<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAVENDER Overlay</title><style>
:root{--a:#d97cff;--cyan:#65e4ff;--gold:#ffd76e}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:#fff;font-family:Inter,Segoe UI,Arial,sans-serif;overflow:hidden}.stage{width:100%;height:100vh;display:flex;align-items:flex-end;justify-content:center;padding:30px 38px}.wrap{width:min(1420px,96vw);filter:drop-shadow(0 16px 32px #000a)}.extras{display:grid;grid-template-columns:.8fr 1.25fr;gap:12px;margin-bottom:12px}.panel{background:linear-gradient(135deg,rgba(31,13,42,.95),rgba(8,14,22,.93));border:1px solid rgba(217,124,255,.46);border-radius:16px;padding:12px 15px;box-shadow:0 0 30px rgba(197,77,255,.13)}.pt{font-size:10px;font-weight:1000;letter-spacing:3px;color:#e6b1ff;margin-bottom:8px}.donors,.queue{display:flex;gap:8px;overflow:hidden}.donor,.q{min-width:0;background:#ffffff09;border:1px solid #ffffff12;border-radius:10px;padding:7px 10px;white-space:nowrap}.donor b{color:var(--gold)}.q b{color:#fff}.q span{color:#c8bacf;font-size:10px;margin-left:5px}.main{display:grid;grid-template-columns:minmax(0,1fr) 180px minmax(0,1fr);gap:10px}.team,.score{min-height:105px;background:linear-gradient(180deg,rgba(20,14,27,.96),rgba(13,10,18,.94));border:1px solid rgba(255,255,255,.15);border-radius:16px}.team{padding:14px 18px;border-left:4px solid var(--a);display:flex;flex-direction:column;justify-content:center}.team.r{text-align:right;align-items:flex-end;border-left:1px solid rgba(255,255,255,.15);border-right:4px solid var(--cyan)}.player{font-size:23px;font-weight:1000}.guild{font-size:14px;font-weight:800;color:#cdbfd4;margin-top:7px}.score{display:flex;flex-direction:column;justify-content:center;align-items:center}.num{font-size:42px;font-weight:1000}.meta{font-size:9px;letter-spacing:2px;color:var(--a);font-weight:1000;margin-top:7px}.header{text-align:center;margin-bottom:7px}.live{font-size:10px;letter-spacing:4px;color:var(--a);font-weight:1000}.title{font-size:22px;font-weight:1000;margin-top:3px}.hidden{display:none!important}@media(max-width:900px){.extras{grid-template-columns:1fr}.stage{padding:15px}.main{grid-template-columns:1fr 120px 1fr}.player{font-size:17px}.num{font-size:30px}}
</style></head><body><div class="stage" id="stage"><div class="wrap hidden" id="wrap"></div></div><script src="/socket.io/socket.io.js"></script><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function draw(d){const o=d?.overlay,m=d?.match;if(!o?.visible){wrap.classList.add("hidden");return}wrap.classList.remove("hidden");document.documentElement.style.setProperty("--a",o.accent||"#d97cff");stage.style.alignItems=o.position==="top"?"flex-start":"flex-end";const donors=(d.donations||[]).slice(0,3),queue=(d.queue||[]).filter(x=>!["ACCEPTED","REJECTED"].includes(x.status)).slice(0,5);const ex=(donors.length||queue.length)?`<div class="extras"><div class="panel"><div class="pt">💜 TOP DONATE</div><div class="donors">${donors.map((x,i)=>`<div class="donor">${["🥇","🥈","🥉"][i]||"💜"} ${esc(x.name)} <b>${Number(x.amount||0).toLocaleString("ru-RU")} сом</b></div>`).join("")||'<div class="donor">Пока нет донатов</div>'}</div></div><div class="panel"><div class="pt">🎮 ОЧЕРЕДЬ НА ПРОВЕРКУ В ГИЛЬДИЮ</div><div class="queue">${queue.map(x=>`<div class="q"><b>#${x.position} ${esc(x.nickname)}</b><span>${x.status==="CHECKING"?"ПРОВЕРКА":"ОЖИДАЕТ"}</span></div>`).join("")||'<div class="q">Очередь свободна</div>'}</div></div></div>`:"";const match=m?`<div class="header"><div class="live">${esc(o.customText||"LAVENDER • LIVE")}</div><div class="title">${esc(m.title||"LIVE MATCH")}</div></div><div class="main"><div class="team"><div class="player">${esc(m.playerA?.nickname||m.guildA?.name||"PLAYER A")}</div><div class="guild">${esc(m.guildA?.name||"")} ${m.playerA?`• ELO ${esc(m.playerA.elo)}`:""}</div></div><div class="score"><div class="num">${m.scoreA||0} : ${m.scoreB||0}</div><div class="meta">${esc(m.roundText||"")} • ${esc(m.status||"LIVE")}</div></div><div class="team r"><div class="player">${esc(m.playerB?.nickname||m.guildB?.name||"PLAYER B")}</div><div class="guild">${esc(m.guildB?.name||"")} ${m.playerB?`• ELO ${esc(m.playerB.elo)}`:""}</div></div></div>`:"";wrap.innerHTML=ex+match}
const id=new URLSearchParams(location.search).get("streamer"),socket=io({reconnection:true});if(id){fetch(`/api/streamer-overlay/${id}`,{cache:"no-store"}).then(r=>r.json()).then(draw);socket.emit("watch-streamer",Number(id));socket.on("streamer-overlay:update",draw)}else{fetch('/api/overlay',{cache:'no-store'}).then(r=>r.json()).then(draw);socket.on('overlay:update',draw)}
</script></body></html>
