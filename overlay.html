<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAVENDER Overlay</title>
<style>
:root{--a:#b46cff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:white;font-family:Inter,Segoe UI,Arial,sans-serif;overflow:hidden}.stage{width:100%;height:100vh;display:flex;justify-content:center;align-items:flex-end;padding:38px 44px}.overlay{width:min(1180px,94vw);filter:drop-shadow(0 16px 30px #000b)}.header{text-align:center;margin-bottom:8px}.live{color:var(--a);font-size:11px;font-weight:1000;letter-spacing:5px}.title{margin-top:4px;font-size:25px;font-weight:1000;text-transform:uppercase}.main{display:grid;grid-template-columns:minmax(0,1fr) 190px minmax(0,1fr);gap:10px}.team,.scorebox{min-height:112px;background:linear-gradient(180deg,rgba(20,14,27,.96),rgba(13,10,18,.94));border:1px solid rgba(255,255,255,.15);border-radius:16px}.team{padding:15px 18px;border-left:4px solid var(--a);display:flex;flex-direction:column;justify-content:center}.team.r{text-align:right;align-items:flex-end;border-left:1px solid rgba(255,255,255,.15);border-right:4px solid var(--a)}.player{display:flex;align-items:center;gap:11px;width:100%}.team.r .player{flex-direction:row-reverse}.avatar{width:48px;height:48px;object-fit:cover;border-radius:13px}.emoji{width:48px;height:48px;display:grid;place-items:center;font-size:29px}.pname{font-size:25px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.guild{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:16px;font-weight:900}.team.r .guild{flex-direction:row-reverse}.gimg{width:27px;height:27px;border-radius:8px;object-fit:cover}.gemoji{font-size:20px}.stats{margin-top:4px;color:#b8acbf;font-size:10px;font-weight:800}.scorebox{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px}.score{font-size:45px;font-weight:1000}.round{margin-top:8px;color:#cbbfd1;font-size:10px;font-weight:900}.status{margin-top:5px;color:var(--a);font-size:9px;font-weight:1000;letter-spacing:3px}.hidden{display:none!important}@media(max-width:900px){.stage{padding:18px}.overlay{width:96vw}.main{grid-template-columns:minmax(0,1fr) 145px minmax(0,1fr);gap:7px}.team,.scorebox{min-height:96px}.pname{font-size:19px}.avatar,.emoji{width:38px;height:38px}.score{font-size:34px}.title{font-size:20px}}
</style></head><body><div class="stage" id="stage"><div class="overlay" id="overlay"></div></div><script src="/socket.io/socket.io.js"></script><script>
"use strict";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function av(v){v=String(v||"");return v.startsWith("data:image/")?`<img class="avatar" src="${v}">`:`<div class="emoji">${esc(v||"👤")}</div>`}
function gl(v){v=String(v||"");return v.startsWith("data:image/")?`<img class="gimg" src="${v}">`:`<span class="gemoji">${esc(v||"🛡️")}</span>`}
function team(r,p,g,o){return `<div class="team ${r?"r":""}">${o.showPlayers&&p?`<div class="player">${av(p.avatar)}<div class="pname">${esc(p.nickname)}</div></div>`:""}<div class="guild">${gl(g?.logo)}<div>${esc(g?.name||(r?"TEAM B":"TEAM A"))}</div></div>${o.showStats&&p?`<div class="stats">ELO ${esc(p.elo)} • RANK ${esc(p.rank)}</div>`:""}</div>`}
function draw(d){const m=d?.match,o=d?.overlay;if(!m||!o?.visible){overlay.className="overlay hidden";return}overlay.className="overlay";document.documentElement.style.setProperty("--a",o.accent||"#b46cff");stage.style.alignItems=o.position==="top"?"flex-start":"flex-end";overlay.innerHTML=`<div class="header"><div class="live">${esc(o.customText||"LAVENDER • LIVE")}</div><div class="title">${esc(m.title||"LIVE MATCH")}</div></div><div class="main">${team(false,m.playerA,m.guildA,o)}<div class="scorebox"><div class="score">${m.scoreA} : ${m.scoreB}</div><div class="round">${esc(m.roundText||"")} • ${esc(m.format||"")}</div><div class="status">● ${esc(m.status||"LIVE")}</div></div>${team(true,m.playerB,m.guildB,o)}</div>`}
const params=new URLSearchParams(location.search),streamerId=params.get("streamer");
const socket=io({reconnection:true,reconnectionDelay:1000,reconnectionDelayMax:5000});
if(streamerId){
  fetch(`/api/streamer-overlay/${streamerId}`,{cache:"no-store"}).then(r=>r.json()).then(draw).catch(()=>{});
  socket.emit("watch-streamer",Number(streamerId));
  socket.on("streamer-overlay:update",draw);
}else{
  fetch("/api/overlay",{cache:"no-store"}).then(r=>r.json()).then(draw).catch(()=>{});
  socket.on("overlay:update",draw);
}
</script></body></html>
