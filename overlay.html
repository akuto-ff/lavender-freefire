<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAVENDER Horizontal Overlay</title>
<style>
:root{--a:#b46cff}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:transparent;
  color:#fff;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  overflow:hidden
}
.stage{
  width:100%;
  height:100vh;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:34px 40px;
}
.hud{
  width:min(1120px,94vw);
  filter:drop-shadow(0 14px 28px #000c);
}
.topline{
  text-align:center;
  margin-bottom:8px;
}
.custom{
  color:var(--a);
  font-size:11px;
  font-weight:1000;
  letter-spacing:5px;
  text-transform:uppercase;
}
.title{
  margin-top:4px;
  font-size:24px;
  font-weight:1000;
  letter-spacing:.5px;
}
.matchbar{
  display:grid;
  grid-template-columns:1fr 180px 1fr;
  align-items:stretch;
  gap:10px;
}
.team{
  min-height:104px;
  background:linear-gradient(180deg,rgba(21,15,29,.97),rgba(9,7,13,.97));
  border:1px solid rgba(255,255,255,.16);
  border-left:4px solid var(--a);
  border-radius:16px;
  padding:14px 18px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.team.right{
  text-align:right;
  align-items:flex-end;
  border-left:1px solid rgba(255,255,255,.16);
  border-right:4px solid var(--a);
}
.player{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:24px;
  line-height:1;
  font-weight:1000;
  min-width:0;
}
.team.right .player{
  flex-direction:row-reverse;
}
.playerName{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.avatar{
  width:44px;
  height:44px;
  flex:0 0 44px;
  border-radius:12px;
  object-fit:cover;
  border:1px solid rgba(255,255,255,.2);
  background:#0a0810;
}
.emoji{
  width:44px;
  height:44px;
  flex:0 0 44px;
  display:grid;
  place-items:center;
  font-size:29px;
}
.guild{
  margin-top:10px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#e9dff0;
  font-size:16px;
  font-weight:900;
}
.team.right .guild{
  flex-direction:row-reverse;
}
.guildLogo{
  width:26px;
  height:26px;
  border-radius:8px;
  object-fit:cover;
}
.guildEmoji{
  font-size:20px;
}
.guildMeta{
  color:#a99bb2;
  font-size:10px;
  font-weight:800;
  margin-top:3px;
}
.center{
  min-height:104px;
  background:linear-gradient(180deg,rgba(28,19,37,.97),rgba(12,8,16,.97));
  border:1px solid rgba(255,255,255,.16);
  border-radius:16px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:10px;
}
.score{
  font-size:42px;
  line-height:1;
  font-weight:1000;
  letter-spacing:2px;
  white-space:nowrap;
}
.round{
  margin-top:8px;
  color:#c7bacd;
  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
  text-align:center;
}
.status{
  margin-top:5px;
  color:var(--a);
  font-size:9px;
  font-weight:1000;
  letter-spacing:3px;
  text-transform:uppercase;
}
.hidden{display:none!important}

@media(max-width:900px){
  .stage{padding:18px}
  .hud{width:96vw}
  .matchbar{grid-template-columns:1fr 135px 1fr;gap:7px}
  .team,.center{min-height:92px;border-radius:13px}
  .team{padding:11px 12px}
  .player{font-size:18px}
  .avatar,.emoji{width:36px;height:36px;flex-basis:36px}
  .emoji{font-size:24px}
  .guild{font-size:13px;margin-top:7px}
  .score{font-size:32px}
  .title{font-size:19px}
  .custom{font-size:9px;letter-spacing:3px}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="hud" id="hud"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
"use strict";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

function avatar(v){
  v = String(v || "");
  return v.startsWith("data:image/")
    ? `<img class="avatar" src="${v}" alt="">`
    : `<span class="emoji">${esc(v || "👤")}</span>`;
}

function guildLogo(v){
  v = String(v || "");
  return v.startsWith("data:image/")
    ? `<img class="guildLogo" src="${v}" alt="">`
    : `<span class="guildEmoji">${esc(v || "🛡️")}</span>`;
}

function teamBlock(side, player, guild, overlay){
  const showPlayer = overlay.showPlayers && player;
  return `
    <div class="team ${side === "right" ? "right" : ""}">
      ${showPlayer ? `
        <div class="player">
          ${avatar(player.avatar)}
          <span class="playerName">${esc(player.nickname)}</span>
        </div>
      ` : ""}
      <div class="guild">
        ${guildLogo(guild?.logo)}
        <span>${esc(guild?.name || (side === "left" ? "TEAM A" : "TEAM B"))}</span>
      </div>
      ${overlay.showStats && player ? `
        <div class="guildMeta">
          ELO ${esc(player.elo)} • RANK ${esc(player.rank)}
        </div>
      ` : ""}
    </div>
  `;
}

function draw(data){
  const m = data?.match;
  const o = data?.overlay;

  if(!m || !o?.visible){
    hud.className = "hud hidden";
    return;
  }

  hud.className = "hud";
  stage.style.alignItems = o.position === "top" ? "flex-start" : "flex-end";
  document.documentElement.style.setProperty("--a", o.accent || "#b46cff");

  hud.innerHTML = `
    <div class="topline">
      <div class="custom">${esc(o.customText || "LAVENDER • LIVE")}</div>
      <div class="title">${esc(m.title || "LIVE MATCH")}</div>
    </div>

    <div class="matchbar">
      ${teamBlock("left", m.playerA, m.guildA, o)}

      <div class="center">
        <div class="score">${esc(m.scoreA)} : ${esc(m.scoreB)}</div>
        <div class="round">${esc(m.roundText || "")} • ${esc(m.format || "")}</div>
        <div class="status">● ${esc(m.status || "LIVE")}</div>
      </div>

      ${teamBlock("right", m.playerB, m.guildB, o)}
    </div>
  `;
}

fetch("/api/overlay", {cache:"no-store"})
  .then(r => r.json())
  .then(draw)
  .catch(() => {});

const socket = io({
  reconnection:true,
  reconnectionDelay:1000,
  reconnectionDelayMax:5000
});

socket.on("overlay:update", draw);
</script>
</body>
</html>
