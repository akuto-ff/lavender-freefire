<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>LAVENDER PRO Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;color:#fff}.stage{height:100vh;display:flex;justify-content:center;padding:54px}.stage.bottom{align-items:flex-end}.stage.top{align-items:flex-start}.hud{width:min(1240px,93vw);filter:drop-shadow(0 16px 28px #000b);transition:.25s}.head{text-align:center;margin-bottom:11px}.custom{font-size:12px;letter-spacing:5px;color:var(--a);font-weight:1000}.tour{font-size:12px;color:#c9bdd0;margin-top:5px;letter-spacing:2px}.title{font-size:34px;font-weight:1000;margin:4px 0}.sub{font-size:11px;color:#c2b5c8;letter-spacing:1px}.row{display:grid;grid-template-columns:1fr 200px 1fr;gap:15px;align-items:center}.team{background:linear-gradient(90deg,#100b17f5,#1a1124eb);border:1px solid #ffffff32;border-left:4px solid var(--a);border-radius:18px;padding:18px 22px;backdrop-filter:blur(12px)}.team.right{text-align:right;border-left:1px solid #ffffff32;border-right:4px solid var(--a)}.playerMain{font-size:27px;font-weight:1000;display:flex;align-items:center;gap:10px}.team.right .playerMain{justify-content:flex-end}.avatar{width:48px;height:48px;border-radius:13px;object-fit:cover;border:1px solid #ffffff38;background:#0b0810}.guildSub{font-size:17px;font-weight:900;color:#f0e4f5;margin-top:8px;display:flex;align-items:center;gap:8px}.team.right .guildSub{justify-content:flex-end}.guildLogo{width:30px;height:30px;border-radius:9px;object-fit:cover}.tag{font-size:10px;color:#c7bacd;letter-spacing:2px}.meta{font-size:11px;color:#ded1e5;margin-top:7px}.rank{color:var(--a);font-weight:1000}.mid{text-align:center}.score{font-size:50px;font-weight:1000;line-height:1}.vs{font-size:10px;letter-spacing:5px;color:#b8aabd;margin-top:5px}.round{font-size:11px;color:#d1c4d6;margin-top:6px}.status{text-align:center;color:var(--a);font-size:10px;letter-spacing:4px;font-weight:1000;margin-top:10px}.compact .head .sub,.compact .head .tour,.compact .meta{display:none}.compact .title{font-size:24px}.compact .team{padding:13px 18px}.compact .playerMain{font-size:22px}.compact .guildSub{font-size:15px}.compact .score{font-size:40px}.compact .row{grid-template-columns:1fr 160px 1fr}.hidden{display:none}
</style></head><body><div class="stage bottom" id="stage"><div class="hud" id="hud"></div></div>
<script src="/socket.io/socket.io.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function img(v,cls,fallback){v=String(v||'').trim();if(v.startsWith('data:image/'))return `<img class="${cls}" src="${v}" alt="">`;return `<span style="font-size:${cls==='avatar'?'30px':'20px'}">${esc(v||fallback)}</span>`}
function draw(d){let o=d?.overlay,m=d?.match;if(!o||!m||!o.visible){hud.className='hud hidden';return}hud.className='hud '+(o.layout==='compact'?'compact':'');stage.className='stage '+(o.position==='top'?'top':'bottom');document.documentElement.style.setProperty('--a',o.accent||'#b46cff');hud.innerHTML=`<div class=head><div class=custom>${esc(o.customText)}</div><div class=tour>${esc(m.tournament)} • ${esc(m.format)}</div><div class=title>${esc(m.title)}</div><div class=sub>${esc(m.subtitle)}</div></div><div class=row><div class=team>${m.playerA?`<div class=playerMain>${img(m.playerA.avatar,'avatar','👤')}<span>${esc(m.playerA.nickname)}</span></div>`:''}<div class=guildSub>${img(m.guildA?.logo,'guildLogo','🪻')}<span>${esc(m.guildA?.name||'TEAM A')}</span> <span class=tag>[${esc(m.guildA?.tag||'')}]</span></div>${m.playerA?`<div class=meta><span class=rank>${m.playerA.rank}</span> • ELO ${m.playerA.elo} • K/D ${m.playerA.kd}</div>`:''}</div><div class=mid><div class=score>${m.scoreA} : ${m.scoreB}</div><div class=vs>VS</div><div class=round>${esc(m.roundText)} • ${esc(m.format)}</div></div><div class="team right">${m.playerB?`<div class=playerMain><span>${esc(m.playerB.nickname)}</span>${img(m.playerB.avatar,'avatar','👤')}</div>`:''}<div class=guildSub><span class=tag>[${esc(m.guildB?.tag||'')}]</span><span>${esc(m.guildB?.name||'TEAM B')}</span>${img(m.guildB?.logo,'guildLogo','🪻')}</div>${m.playerB?`<div class=meta>K/D ${m.playerB.kd} • ELO ${m.playerB.elo} • <span class=rank>${m.playerB.rank}</span></div>`:''}</div></div><div class=status>● ${esc(m.status)}</div>`}
fetch('/api/overlay').then(r=>r.json()).then(draw);io().on('overlay:update',draw);
</script></body></html>
