<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAVENDER Overlay</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:white;font-family:Inter,Segoe UI,Arial,sans-serif;overflow:hidden}.stage{height:100vh;display:flex;align-items:flex-end;justify-content:center;padding:52px}.hud{width:min(1240px,93vw);filter:drop-shadow(0 16px 28px #000b)}.head{text-align:center;margin-bottom:11px}.custom{font-size:12px;letter-spacing:5px;color:var(--a);font-weight:1000}.title{font-size:34px;font-weight:1000;margin:5px}.row{display:grid;grid-template-columns:1fr 200px 1fr;gap:15px;align-items:center}.team{background:#110c18f1;border:1px solid #ffffff32;border-left:4px solid var(--a);border-radius:18px;padding:18px 22px}.team.r{text-align:right;border-left:1px solid #ffffff32;border-right:4px solid var(--a)}.player{font-size:27px;font-weight:1000;display:flex;align-items:center;gap:10px}.team.r .player{justify-content:flex-end}.avatar{width:48px;height:48px;border-radius:13px;object-fit:cover;border:1px solid #ffffff2d}.guild{font-size:18px;font-weight:900;margin-top:8px;color:#f1e5f5}.score{text-align:center;font-size:50px;font-weight:1000}.round{text-align:center;color:#cbbfd0;font-size:11px}.status{text-align:center;margin-top:10px;color:var(--a);font-size:10px;letter-spacing:4px;font-weight:1000}.hidden{display:none}@media(max-width:900px){.stage{padding:18px;align-items:center}.hud{width:96vw}.row{grid-template-columns:1fr;gap:10px}.team,.team.r{text-align:center;border:1px solid #ffffff32;border-top:4px solid var(--a)}.player,.team.r .player{justify-content:center;font-size:22px}.guild{font-size:16px}.score{font-size:44px}.title{font-size:27px}}</style></head><body><div class="stage" id="stage"><div class="hud" id="hud"></div></div><script src="/socket.io/socket.io.js"></script><script>
"use strict";const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function media(v){v=String(v||"");return v.startsWith("data:image/")?`<img class="avatar" src="${v}" alt="">`:`<span style="font-size:30px">${esc(v||"👤")}</span>`}function draw(d){const m=d?.match,o=d?.overlay;if(!m||!o?.visible){hud.className="hud hidden";return}hud.className="hud";stage.style.alignItems=o.position==="top"?"flex-start":"flex-end";document.documentElement.style.setProperty("--a",o.accent||"#b46cff");hud.innerHTML=`<div class="head"><div class="custom">${esc(o.customText)}</div><div class="title">${esc(m.title)}</div></div><div class="row"><div class="team">${o.showPlayers&&m.playerA?`<div class="player">${media(m.playerA.avatar)}<span>${esc(m.playerA.nickname)}</span></div>`:""}<div class="guild">${media(m.guildA?.logo)} ${esc(m.guildA?.name||"TEAM A")}</div></div><div><div class="score">${m.scoreA} : ${m.scoreB}</div><div class="round">${esc(m.roundText)} • ${esc(m.format)}</div></div><div class="team r">${o.showPlayers&&m.playerB?`<div class="player"><span>${esc(m.playerB.nickname)}</span>${media(m.playerB.avatar)}</div>`:""}<div class="guild">${esc(m.guildB?.name||"TEAM B")} ${media(m.guildB?.logo)}</div></div></div><div class="status">● ${esc(m.status)}</div>`}fetch("/api/overlay",{cache:"no-store"}).then(r=>r.json()).then(draw).catch(()=>{});const s=io({reconnection:true,reconnectionDelay:1000,reconnectionDelayMax:5000});s.on("overlay:update",draw);
</script></body></html>
