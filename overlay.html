<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAVENDER Overlay</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,Segoe UI,Arial,sans-serif;color:#fff}
#root{width:100%;height:100%;display:flex;align-items:flex-end;padding:36px}
.hud{width:100%;max-width:1500px;margin:0 auto}
.top{text-align:center;font-weight:1000;letter-spacing:5px;margin-bottom:10px;font-size:18px}
.row{display:grid;grid-template-columns:1fr 180px 1fr;gap:14px;align-items:center}
.team{min-height:100px;padding:15px 18px;display:flex;align-items:center;gap:14px;border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(14px)}
.team.r{justify-content:flex-end;text-align:right}
.avatar{width:70px;height:70px;object-fit:cover;border:2px solid currentColor;background:#09070d}
.avatarEmoji{width:70px;height:70px;display:grid;place-items:center;font-size:38px;border:2px solid currentColor;background:#09070d}
.player{font-weight:1000;font-size:24px}
.guild{font-size:15px;opacity:.75;margin-top:4px}
.score{text-align:center;font-size:50px;font-weight:1000}
.round{text-align:center;font-size:13px;opacity:.78;margin-top:2px}
.status{text-align:center;margin-top:10px;font-size:12px;font-weight:1000;letter-spacing:5px}
.hidden{display:none!important}
@media(max-width:900px){#root{padding:16px}.row{grid-template-columns:1fr}.score{order:-1}.team,.team.r{justify-content:center;text-align:center}}
</style>
</head>
<body>
<div id="root"><div class="hud" id="hud"></div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const params=new URLSearchParams(location.search);
const streamerId=Number(params.get("streamer"))||null;
const socket=io({transports:["websocket","polling"]});

function media(v,cls,shape,accent){
  const value=String(v||"").trim();
  if(!value)return "";
  const radius=shape==="circle"?"50%":shape==="square"?"4px":"16px";
  if(value.startsWith("data:image/")||/^https?:\/\//i.test(value)){
    return `<img class="${cls}" src="${esc(value)}" style="border-radius:${radius};border-color:${accent}" alt="">`;
  }
  return `<div class="avatarEmoji" style="border-radius:${radius};border-color:${accent}">${esc(value)}</div>`;
}

function render(state){
  const m=state?.match;
  const o=state?.overlay||{};
  if(!m||o.visible===false){
    $("hud").innerHTML="";
    return;
  }

  const accent=o.accent||"#b46cff";
  const text=o.textColor||"#ffffff";
  const panel=o.panelColor||"#17101e";
  const glow=o.glowColor||accent;
  const bg=o.backgroundColor||"#08060b";
  const theme=o.theme||"neon";
  const shape=o.avatarShape||"rounded";
  const showAvatars=o.showAvatars!==false;

  const shadow=theme==="minimal"?"none":`0 0 30px ${glow}77`;
  const panelBg=theme==="glass"?`${panel}bb`:`${panel}ee`;
  const borderRadius=theme==="minimal"?"4px":"16px";

  document.body.style.color=text;

  const left=o.leftAvatar||m.playerA?.avatar||"";
  const right=o.rightAvatar||m.playerB?.avatar||"";

  $("root").style.alignItems=o.position==="top"?"flex-start":"flex-end";

  $("hud").innerHTML=`
    <div class="top" style="color:${accent};text-shadow:${shadow}">${esc(o.customText||"LAVENDER • LIVE")}</div>
    <div class="row">
      <div class="team" style="background:${panelBg};border-color:${accent}88;border-radius:${borderRadius};box-shadow:${shadow}">
        ${showAvatars?media(left,"avatar",shape,accent):""}
        <div>
          <div class="player">${esc(m.playerA?.nickname||"PLAYER A")}</div>
          <div class="guild">${esc(m.guildA?.name||"TEAM A")}</div>
        </div>
      </div>
      <div>
        <div class="score" style="text-shadow:${shadow}">${Number(m.scoreA)||0} : ${Number(m.scoreB)||0}</div>
        <div class="round">${esc(m.roundText||"")}</div>
      </div>
      <div class="team r" style="background:${panelBg};border-color:${accent}88;border-radius:${borderRadius};box-shadow:${shadow}">
        <div>
          <div class="player">${esc(m.playerB?.nickname||"PLAYER B")}</div>
          <div class="guild">${esc(m.guildB?.name||"TEAM B")}</div>
        </div>
        ${showAvatars?media(right,"avatar",shape,accent):""}
      </div>
    </div>
    <div class="status" style="color:${accent};text-shadow:${shadow}">● ${esc(m.status||"LIVE")}</div>
  `;
}

async function fetchState(){
  const url=streamerId?`/api/streamer-overlay/${streamerId}`:"/api/overlay";
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok)return;
  render(await r.json());
}

if(streamerId){
  socket.emit("watch-streamer",streamerId);
  socket.on("streamer-overlay:update",render);
}else{
  socket.on("overlay:update",render);
}
socket.on("site:update",()=>setTimeout(fetchState,120));
fetchState();
</script>
</body>
</html>
