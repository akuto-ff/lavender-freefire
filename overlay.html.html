<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAVENDER Horizontal Overlay</title>

<style>
:root{
  --accent:#b46cff;
  --panel:rgba(13,10,18,.94);
  --panel2:rgba(20,14,27,.96);
  --border:rgba(255,255,255,.15);
  --muted:#b8acbf;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  color:#fff;
  font-family:Inter,Segoe UI,Arial,sans-serif;
}

.stage{
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  padding:38px 44px;
}

.overlay{
  width:min(1180px,94vw);
  filter:drop-shadow(0 16px 30px rgba(0,0,0,.72));
}

.header{
  text-align:center;
  margin-bottom:8px;
}

.live-label{
  color:var(--accent);
  font-size:11px;
  font-weight:1000;
  letter-spacing:5px;
  text-transform:uppercase;
  text-shadow:0 0 14px color-mix(in srgb,var(--accent) 70%,transparent);
}

.match-title{
  margin-top:4px;
  font-size:25px;
  line-height:1;
  font-weight:1000;
  letter-spacing:.8px;
  text-transform:uppercase;
}

.main{
  display:grid;
  grid-template-columns:minmax(0,1fr) 190px minmax(0,1fr);
  gap:10px;
  align-items:stretch;
}

.team{
  min-height:112px;
  padding:15px 18px;
  background:
    linear-gradient(180deg,var(--panel2),var(--panel)),
    radial-gradient(circle at top left,color-mix(in srgb,var(--accent) 18%,transparent),transparent 50%);
  border:1px solid var(--border);
  border-left:4px solid var(--accent);
  border-radius:16px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  overflow:hidden;
}

.team.right{
  text-align:right;
  align-items:flex-end;
  border-left:1px solid var(--border);
  border-right:4px solid var(--accent);
}

.player{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
}

.team.right .player{
  flex-direction:row-reverse;
}

.avatar{
  width:48px;
  height:48px;
  flex:0 0 48px;
  object-fit:cover;
  border-radius:13px;
  border:1px solid rgba(255,255,255,.18);
  background:#0b0810;
}

.emoji-avatar{
  width:48px;
  height:48px;
  flex:0 0 48px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:#0b0810;
  border:1px solid rgba(255,255,255,.18);
  font-size:29px;
}

.player-name{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:25px;
  font-weight:1000;
  letter-spacing:.3px;
}

.guild{
  width:100%;
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:9px;
  color:#f0e6f5;
  font-size:16px;
  font-weight:900;
}

.team.right .guild{
  flex-direction:row-reverse;
}

.guild-logo{
  width:27px;
  height:27px;
  object-fit:cover;
  border-radius:8px;
}

.guild-emoji{
  width:27px;
  height:27px;
  display:grid;
  place-items:center;
  font-size:20px;
}

.stats{
  margin-top:4px;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
}

.scorebox{
  min-height:112px;
  background:linear-gradient(180deg,rgba(27,18,36,.97),rgba(10,7,14,.97));
  border:1px solid var(--border);
  border-radius:16px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:10px;
  position:relative;
  overflow:hidden;
}

.scorebox:before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at center,color-mix(in srgb,var(--accent) 16%,transparent),transparent 68%);
  pointer-events:none;
}

.score{
  position:relative;
  font-size:45px;
  line-height:1;
  font-weight:1000;
  letter-spacing:2px;
  white-space:nowrap;
}

.round{
  position:relative;
  margin-top:8px;
  color:#cbbfd1;
  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
  text-align:center;
}

.status{
  position:relative;
  margin-top:5px;
  color:var(--accent);
  font-size:9px;
  font-weight:1000;
  letter-spacing:3px;
  text-transform:uppercase;
}

.hidden{display:none!important}

@media(max-width:900px){
  .stage{padding:18px}
  .overlay{width:96vw}
  .main{grid-template-columns:minmax(0,1fr) 145px minmax(0,1fr);gap:7px}
  .team,.scorebox{min-height:96px;border-radius:13px}
  .team{padding:11px 12px}
  .player-name{font-size:19px}
  .avatar,.emoji-avatar{width:38px;height:38px;flex-basis:38px}
  .emoji-avatar{font-size:24px}
  .guild{font-size:13px;margin-top:7px}
  .score{font-size:34px}
  .match-title{font-size:20px}
  .live-label{font-size:9px;letter-spacing:3px}
}

@media(max-width:620px){
  .main{grid-template-columns:1fr 110px 1fr}
  .player-name{font-size:16px}
  .guild{font-size:11px}
  .score{font-size:28px}
  .avatar,.emoji-avatar{width:32px;height:32px;flex-basis:32px}
  .emoji-avatar{font-size:20px}
  .team{padding:9px}
}
</style>
</head>

<body>
<div class="stage" id="stage">
  <div class="overlay" id="overlay"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
"use strict";

const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
}[c]));

function avatar(value){
  value = String(value || "");
  if(value.startsWith("data:image/")){
    return `<img class="avatar" src="${value}" alt="">`;
  }
  return `<div class="emoji-avatar">${esc(value || "👤")}</div>`;
}

function guildLogo(value){
  value = String(value || "");
  if(value.startsWith("data:image/")){
    return `<img class="guild-logo" src="${value}" alt="">`;
  }
  return `<div class="guild-emoji">${esc(value || "🛡️")}</div>`;
}

function renderTeam(side, player, guild, settings){
  const right = side === "right";

  return `
    <div class="team ${right ? "right" : ""}">
      ${
        settings.showPlayers && player
        ? `
          <div class="player">
            ${avatar(player.avatar)}
            <div class="player-name">${esc(player.nickname)}</div>
          </div>
        `
        : ""
      }

      <div class="guild">
        ${guildLogo(guild?.logo)}
        <div>${esc(guild?.name || (right ? "TEAM B" : "TEAM A"))}</div>
      </div>

      ${
        settings.showStats && player
        ? `
          <div class="stats">
            ELO ${esc(player.elo)} • RANK ${esc(player.rank)}
          </div>
        `
        : ""
      }
    </div>
  `;
}

function draw(data){
  const match = data?.match;
  const settings = data?.overlay;

  if(!match || !settings?.visible){
    overlay.className = "overlay hidden";
    return;
  }

  overlay.className = "overlay";

  document.documentElement.style.setProperty(
    "--accent",
    settings.accent || "#b46cff"
  );

  stage.style.alignItems =
    settings.position === "top" ? "flex-start" : "flex-end";

  overlay.innerHTML = `
    <div class="header">
      <div class="live-label">
        ${esc(settings.customText || "LAVENDER • LIVE")}
      </div>

      <div class="match-title">
        ${esc(match.title || "LIVE MATCH")}
      </div>
    </div>

    <div class="main">

      ${renderTeam(
        "left",
        match.playerA,
        match.guildA,
        settings
      )}

      <div class="scorebox">
        <div class="score">
          ${esc(match.scoreA)} : ${esc(match.scoreB)}
        </div>

        <div class="round">
          ${esc(match.roundText || "")}
          ${match.format ? " • " + esc(match.format) : ""}
        </div>

        <div class="status">
          ● ${esc(match.status || "LIVE")}
        </div>
      </div>

      ${renderTeam(
        "right",
        match.playerB,
        match.guildB,
        settings
      )}

    </div>
  `;
}

fetch("/api/overlay", {
  cache:"no-store"
})
.then(r => r.json())
.then(draw)
.catch(console.error);

const socket = io({
  reconnection:true,
  reconnectionAttempts:Infinity,
  reconnectionDelay:1000,
  reconnectionDelayMax:5000
});

socket.on("overlay:update", draw);
</script>
</body>
</html>
